# Configuração PESSOAL (modelo). Só sua.
#
# Como usar:
#   1. npm run init-config   (copia este arquivo para ~/.config/aspa-mcp/pessoal.yaml)
#   2. Troque a assinatura e escolha quando quer ser avisado.
#
# Tudo aqui tem prioridade sobre o equipe.yaml. Apague o que quiser herdar da equipe.
# As mudanças valem na hora: não precisa reiniciar nada.

rascunhos:
  assinatura: "Seu Nome, Equipe de Suporte"
  # tom: "Mais informal, pode usar emoji com moderação."   # descomente para ter um tom só seu

notificacoes:
  # Escolha UMA das combinações abaixo (descomente a linha "abas" que quiser).

  abas: [meus]                          # só as conversas atribuídas a você
  # abas: [todos]                       # toda conversa nova, de qualquer atendente
  # abas: [meus, pendentes]             # as suas e as que estão esperando atendente

  # Filtros opcionais (funcionam junto com as abas):
  # atendentes: [Seu Nome, sem_atendente]   # só as suas e as sem atendente
  # contatos_ignorar: [Teste]               # nunca avisa de contatos com "Teste" no nome
  # contatos_incluir: [Cliente VIP]         # só avisa destes contatos

  canais: [desktop, slack]              # tire "desktop" para receber só no Slack
  dias: [seg, ter, qua, qui, sex]
  horario:
    inicio: "09:00"
    fim: "18:00"
  fora_do_horario: acumular             # acumular: resumo quando o expediente começa; ignorar: descarta
  intervalo_minimo_minutos: 5           # no máximo 1 aviso a cada 5 minutos por contato

# Rascunho automático: quando um cliente escreve numa conversa que entra nos seus avisos,
# o Claude Code lê a conversa (e transcreve áudios) em segundo plano e manda no Slack um
# resumo e um rascunho de resposta. Nada é enviado ao cliente sem você pedir.
rascunho_automatico:
  ativo: false
  # contatos: [Cliente VIP]             # só para estes contatos (vazio = todos dos seus avisos)
  # espera_segundos: 45                 # espera o cliente parar de digitar
  # maximo_por_hora: 20                 # limite de rascunhos por hora
