# Configuração da EQUIPE.
#
# Preencha com os dados da sua empresa. Para ver um exemplo completo preenchido,
# abra exemplos/equipe.yaml no repositório (empresa fictícia).
#
# Compartilhe este arquivo com o time por um canal privado (não coloque no repositório).
# O pessoal.yaml de cada pessoa tem prioridade sobre este arquivo.
# As mudanças valem na hora: não precisa reiniciar nada.

empresa:
  nome: "Nome da empresa"
  descricao: >
    Uma ou duas frases sobre o que a empresa faz, para quem e qual é o principal
    produto. O assistente usa isso como contexto para escrever os rascunhos.

rascunhos:
  idioma: pt-BR
  tom: "Cordial, objetivo e sem jargão técnico. Trate o cliente por você."
  assinatura: "Equipe de Suporte"
  saudacao_por_horario: true        # começa com Bom dia / Boa tarde / Boa noite
  tamanho_maximo: "até 6 linhas"
  sempre:
    - "Confirme o entendimento do problema antes de propor a solução."
    - "Se faltar informação, faça no máximo duas perguntas objetivas."
    - "Use os documentos da pasta conhecimento para qualquer fato sobre produtos, prazos e preços."
  nunca:
    - "Prometer prazos ou preços que não estejam nos documentos."
    - "Pedir senha ou código de verificação ao cliente."
    - "Culpar o cliente pelo problema."
  quando_usar_template: "Quando a janela de 24h do WhatsApp estiver fechada."
  exemplos: []                      # veja exemplos/equipe.yaml para o formato

conhecimento:
  # pasta: ~/outra/pasta   # padrão: a pasta "conhecimento" ao lado deste arquivo (.md, .txt, .pdf, .csv, .json, .yaml)

auditoria:
  # arquivo: ~/outro/auditoria.jsonl   # padrão: ~/.local/share/aspa-mcp/auditoria.jsonl
  incluir_texto: true                  # false: guarda só o tamanho dos textos

notificacoes:
  abas: [meus]                         # meus, pendentes, todos
  apenas_mensagens_de_cliente: true    # true: só avisa quando chega mensagem do cliente
  canais: [desktop, slack]             # desktop, slack, ntfy (Slack e ntfy precisam do arquivo env)
  dias: [seg, ter, qua, qui, sex]      # dom, seg, ter, qua, qui, sex, sab
  horario:
    inicio: "08:00"
    fim: "18:00"
  fuso: America/Sao_Paulo
  fora_do_horario: acumular            # acumular: resumo quando o expediente começa; ignorar: descarta
  intervalo_minimo_minutos: 0          # evita vários avisos seguidos do mesmo contato
  sessao_expirada: true                # avisa quando precisa fazer login de novo no Aspa
  atendentes: []                       # vazio = qualquer; ou nomes; "sem_atendente"
  contatos_incluir: []                 # se preenchido, só avisa destes contatos
  contatos_ignorar: []                 # nunca avisa destes contatos
  nova_conversa: true                  # avisa quando surge conversa nova
  mostrar_atendente: true              # mostra o atendente no aviso
