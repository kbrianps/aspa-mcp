# EXEMPLO de configuração da EQUIPE preenchida, de uma empresa FICTÍCIA.
# Use como referência de formato. O npm run init-config copia o modelo em branco
# (modelos/equipe.yaml), não este arquivo.
#
# O pessoal.yaml de cada pessoa tem prioridade sobre este arquivo.
# As mudanças valem na hora: não precisa reiniciar nada.

empresa:
  nome: "Acme Monitoramento"
  descricao: >
    Plataforma de monitoramento por câmeras para lojas, condomínios e empresas.
    O cliente acompanha as câmeras ao vivo pelo app e pelo painel web, recebe alertas
    de eventos (movimento, pessoa, veículo) e consulta gravações dos últimos 30 dias.

rascunhos:
  idioma: pt-BR

  # Como escrever. Seja específico: o Claude segue isto ao pé da letra.
  tom: >
    Cordial, objetivo e sem jargão técnico. Trate o cliente por você.
    Frases curtas. Nada de "prezado" ou "atenciosamente".

  # Assinatura padrão da equipe. Cada pessoa troca pela sua no pessoal.yaml.
  assinatura: "Equipe de Suporte Acme"

  saudacao_por_horario: true        # começa com Bom dia / Boa tarde / Boa noite
  tamanho_maximo: "até 6 linhas"

  # Regras que valem para TODO rascunho.
  sempre:
    - "Confirme o entendimento do problema antes de propor a solução."
    - "Se faltar informação, faça no máximo duas perguntas objetivas."
    - "Use os documentos da pasta conhecimento para qualquer fato sobre planos, prazos e preços."
    - "Quando passar um passo a passo, numere os passos."
    - "Se o problema já foi resolvido, pergunte se pode concluir o atendimento."

  nunca:
    - "Prometer prazos ou preços que não estejam nos documentos."
    - "Pedir senha, código de verificação ou dados de cartão."
    - "Culpar o cliente pelo problema."
    - "Prometer visita técnica sem confirmar com o time de campo."
    - "Mandar links que não sejam do site oficial."

  quando_usar_template: "Quando a janela de 24h do WhatsApp estiver fechada ou para o primeiro contato ativo."

  # Respostas modelo. O Claude imita o estilo (não copia palavra por palavra).
  exemplos:
    - situacao: "Cliente diz que uma câmera está offline"
      resposta: |
        Boa tarde, Maria! Vou te ajudar com isso.
        Para eu verificar, me confirma:
        1. Qual câmera está offline (nome que aparece no app)?
        2. Desde quando?
        Enquanto isso, vale conferir se o equipamento está ligado na tomada.
        Equipe de Suporte Acme

    - situacao: "Cliente não consegue entrar no app"
      resposta: |
        Bom dia, João! Vamos resolver.
        Tenta, por favor, o "Esqueci minha senha" na tela de login, com o e-mail cadastrado.
        Se o e-mail não chegar em 5 minutos, me avisa que eu verifico o cadastro por aqui.
        Equipe de Suporte Acme

    - situacao: "Cliente pede gravação antiga"
      resposta: |
        Boa tarde, Carla! As gravações ficam disponíveis por 30 dias no seu plano.
        Me passa a câmera, o dia e o horário aproximado que eu te mostro como baixar o trecho.
        Equipe de Suporte Acme

    - situacao: "Cliente quer cancelar"
      resposta: |
        Boa tarde, Pedro. Entendi, sinto muito que não atendeu.
        Antes de seguir, posso perguntar o motivo? Às vezes dá para ajustar o plano.
        Se preferir cancelar mesmo, eu te explico os próximos passos.
        Equipe de Suporte Acme

conhecimento:
  pasta: ~/.config/aspa-mcp/conhecimento   # .md, .txt, .pdf, .csv, .json, .yaml (subpastas valem)

auditoria:
  arquivo: ~/.local/share/aspa-mcp/auditoria.jsonl   # registro de toda ação feita no Aspa
  incluir_texto: true                                 # false: guarda só o tamanho dos textos

# Notificações padrão da equipe. Cada pessoa ajusta no pessoal.yaml.
notificacoes:
  abas: [meus]                         # meus, pendentes, todos
  apenas_mensagens_de_cliente: true    # true: só avisa quando chega mensagem do cliente
  canais: [desktop, slack]             # desktop, slack, ntfy (Slack e ntfy precisam do arquivo env)
  dias: [seg, ter, qua, qui, sex]      # dom, seg, ter, qua, qui, sex, sab
  horario:
    inicio: "08:00"
    fim: "18:00"
  fuso: America/Sao_Paulo
  fora_do_horario: acumular            # acumular: manda um resumo quando o expediente começa; ignorar: descarta
  intervalo_minimo_minutos: 0          # evita vários avisos seguidos do mesmo contato
  sessao_expirada: true                # avisa quando precisa fazer login de novo no Aspa
  atendentes: []                       # vazio = qualquer; ou nomes; "sem_atendente"
  contatos_incluir: []                 # se preenchido, só avisa destes contatos
  contatos_ignorar: []                 # nunca avisa destes contatos
  nova_conversa: true                  # avisa quando surge conversa nova
  mostrar_atendente: true              # mostra o atendente no aviso
